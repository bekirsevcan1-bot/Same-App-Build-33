<!DOCTYPE html>
<html lang="tr">

<meta charset="UTF-8" />

<title>Usta Cepte — Antalya'ya Özel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root{
    --bg:#0E1417; --surface:#171F23; --surface2:#1E282D;
    --copper:#E3A344; --teal:#3FC7A6; --text:#F3EFE6; --muted:#8AA0A6;
    --border:rgba(255,255,255,0.09); --danger:#E2572B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#0B0F11;font-family:'Segoe UI',Inter,system-ui,sans-serif;color:var(--text);}
  #page{min-height:100vh;background:radial-gradient(circle at 30% 0%, #17232A 0%, #0B0F11 60%);display:flex;justify-content:center;}
  #phone{width:100%;max-width:460px;min-height:100vh;background:var(--bg);position:relative;border-left:1px solid var(--border);border-right:1px solid var(--border);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:13.5px;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  label.fl{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 5px;font-weight:600;}
  ::placeholder{color:var(--muted);}
  a{color:var(--teal);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand-badge{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--copper),#c97f1f);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#10161A;}
  .brand-name{font-weight:800;font-size:17px;letter-spacing:0.2px;}
  .brand-tag{font-size:10px;color:var(--teal);font-weight:700;letter-spacing:0.4px;}
  .iconbtn{background:var(--surface);border:1px solid var(--border);border-radius:11px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;}

  .hero{padding:8px 20px 18px;}
  .hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(63,199,166,0.12);border:1px solid rgba(63,199,166,0.35);color:var(--teal);font-size:11px;font-weight:700;padding:5px 10px;border-radius:99px;margin-bottom:12px;}
  .hero h1{font-size:26px;line-height:1.15;margin:0 0 8px;font-weight:800;}
  .hero p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 16px;}
  .cta{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--copper);color:#10161A;border:none;padding:13px 18px;border-radius:13px;font-weight:800;font-size:14px;width:100%;}
  .cta.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border);}

  .section{padding:10px 20px;}
  .section-label{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.4px;margin-bottom:10px;}
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px;}
  .cat-tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 3px;}
  .cat-tile.active{background:var(--teal);border-color:var(--teal);color:#10161A;}
  .cat-tile .ic{font-size:19px;}
  .cat-tile .lb{font-size:10px;font-weight:600;text-align:center;line-height:1.2;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{display:flex;align-items:center;justify-content:space-between;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .badge{font-size:10px;font-weight:800;padding:4px 9px;border-radius:99px;border:1px solid;flex-shrink:0;}

  .bottomnav{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;height:70px;background:rgba(20,27,31,0.94);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 6px;z-index:20;}
  .navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);width:64px;padding:6px 0;font-size:10px;font-weight:600;}
  .navbtn.active{color:var(--teal);}
  .navbtn .ic{font-size:18px;}
  .fab{width:52px;height:52px;border-radius:16px;background:var(--copper);border:none;display:flex;align-items:center;justify-content:center;margin-top:-24px;box-shadow:0 8px 20px rgba(227,163,68,0.35);font-size:22px;color:#10161A;}

  .support-fab{position:fixed;right:16px;bottom:86px;max-width:460px;z-index:25;width:52px;height:52px;border-radius:50%;background:var(--teal);border:none;box-shadow:0 8px 18px rgba(63,199,166,0.4);font-size:22px;display:flex;align-items:center;justify-content:center;}
  .overlay{position:fixed;inset:0;background:rgba(6,9,10,0.6);display:flex;align-items:flex-end;justify-content:center;z-index:40;}
  .sheet{width:100%;max-width:460px;max-height:82vh;background:var(--bg);border-top-left-radius:20px;border-top-right-radius:20px;border:1px solid var(--border);overflow-y:auto;padding-bottom:20px;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;position:sticky;top:0;background:var(--bg);}

  .progress{display:flex;gap:8px;padding:0 20px 14px;}
  .progress .bar{height:4px;border-radius:99px;background:rgba(255,255,255,0.09);margin-bottom:5px;}
  .progress .bar.on{background:var(--teal);}
  .progress .lb{font-size:10.5px;color:var(--muted);font-weight:700;}
  .progress .lb.on{color:var(--teal);}

  .field{margin-bottom:2px;}
  .priority-row{display:flex;gap:8px;margin:8px 0 14px;}
  .priority-btn{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;color:var(--text);}
  .priority-btn.on{border-color:var(--copper);background:#3a2415;color:var(--copper);}
  .slot-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 12px;font-size:13px;margin-bottom:7px;color:var(--text);width:100%;text-align:left;}
  .slot-btn.on{border-color:var(--teal);background:var(--surface2);color:var(--teal);font-weight:700;}

  .submitbar{position:sticky;bottom:0;padding:14px 18px 4px;background:linear-gradient(to top, var(--bg) 65%, transparent);}

  #leafletDiv{width:100%;height:280px;border-radius:16px;overflow:hidden;border:1px solid var(--border);}
  .live-badge{position:absolute;top:10px;left:10px;z-index:410;background:rgba(14,20,23,0.88);border:1px solid var(--border);border-radius:99px;padding:6px 11px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;}
  .pulse-dot{width:14px;height:14px;border-radius:50%;background:#2E7DFF;border:3px solid #ffffff;box-shadow:0 0 0 rgba(46,125,255,0.5);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,125,255,0.55);}70%{box-shadow:0 0 0 14px rgba(46,125,255,0);}100%{box-shadow:0 0 0 0 rgba(46,125,255,0);}}

  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:14px;}
  .tab{flex:1;text-align:center;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:700;color:var(--muted);background:none;border:none;}
  .tab.on{background:var(--teal);color:#10161A;}

  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:7px 9px;font-size:12px;margin:0 6px 6px 0;}
  .chip input{width:auto;margin:0;}
  .chipgrid{display:grid;grid-template-columns:1fr 1fr;gap:0;max-height:220px;overflow-y:auto;padding:8px 4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:6px;}

  .contract-box{max-height:190px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:11.5px;line-height:1.6;color:var(--muted);margin:8px 0 10px;}
  .contract-box b{color:var(--text);}
  .fee-highlight{background:linear-gradient(90deg,#3a2415,#241a10);border:1px solid var(--copper);color:var(--copper);border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;text-align:center;margin:10px 0;}
  .disclaimer{font-size:10.5px;color:var(--muted);background:rgba(226,87,43,0.08);border:1px solid rgba(226,87,43,0.3);border-radius:10px;padding:9px 11px;margin:10px 0;}
  .agree-row{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:var(--muted);margin:10px 0 14px;}
  .agree-row input{width:auto;margin-top:2px;}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;max-width:400px;background:var(--surface2);border:1px solid var(--teal);color:var(--text);padding:12px 16px;border-radius:12px;font-size:13px;z-index:60;box-shadow:0 10px 24px rgba(0,0,0,0.4);}

  .support-panel{position:fixed;right:14px;bottom:150px;max-width:340px;width:88vw;background:var(--surface);border:1px solid var(--border);border-radius:16px;z-index:50;box-shadow:0 16px 34px rgba(0,0,0,0.5);overflow:hidden;}
  .support-head{background:var(--teal);color:#10161A;padding:12px 14px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;align-items:center;}
  .support-msgs{max-height:220px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
  .msg{max-width:85%;padding:8px 11px;border-radius:12px;font-size:12.5px;line-height:1.4;}
  .msg.bot{background:var(--surface2);align-self:flex-start;}
  .msg.me{background:var(--copper);color:#10161A;align-self:flex-end;font-weight:600;}
  .support-input{display:flex;border-top:1px solid var(--border);}
  .support-input input{border:none;border-radius:0;background:transparent;}
  .support-input button{background:var(--teal);color:#10161A;border:none;padding:0 16px;font-weight:800;}

  .jobcard{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px;}
  .jobfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06);}
  .btn-sm{background:var(--teal);color:#10161A;border:none;border-radius:9px;padding:7px 12px;font-weight:800;font-size:11.5px;}
  .btn-sm.copper{background:var(--copper);}
  .steps-col{display:flex;flex-direction:column;gap:14px;}
  .stepnum{font-weight:800;color:var(--copper);font-size:13px;border:1px solid var(--border);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
</style>
</head>

function renderToastOnly(){ const el=document.getElementById('toastHolder'); if(el) el.outerHTML = toastHtml(); }
function toastHtml(){ return STATE.toast ? `<div class="toast" id="toastHolder">${STATE.toast}</div>` : `<span id="toastHolder"></span>`; }
function haversine(lat1,lon1,lat2,lon2){ const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

function initLeaflet(){
  const el = document.getElementById('leafletDiv');
  if(!el || typeof L==='undefined') return;
  if(leafletMap){ leafletMap.remove(); leafletMap=null; }
  leafletMap = L.map('leafletDiv',{zoomControl:true}).setView([37.05,30.9],8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap katkıda bulunanlar', maxZoom:19
  }).addTo(leafletMap);
  DISTRICTS.forEach(d=>{
    L.circleMarker([d.lat,d.lon],{radius:4,color:'#3FC7A6',fillColor:'#3FC7A6',fillOpacity:0.7,weight:1})
      .addTo(leafletMap).bindTooltip(d.name);
  });
  masterMarkers = {};
  MOCK_MASTERS.forEach(m=>{
    const icon = L.divIcon({className:'', html:`<div style="background:#1E282D;border:2px solid #3FC7A6;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;">${catInfo(m.cat).ic}</div>`, iconSize:[30,30]});
    const mk = L.marker([m.lat,m.lon],{icon}).addTo(leafletMap)
      .bindPopup(`<b>${m.name}</b><br>${catInfo(m.cat).label}<br>⭐ ${m.rating} · ${m.jobs} iş · ${m.ilce}`);
    masterMarkers[m.id]=mk;
  });
  if(STATE.liveLocation){ addCustomerMarker(STATE.liveLocation); leafletMap.setView([STATE.liveLocation.lat,STATE.liveLocation.lon],13); }
  if(moveTimer) clearInterval(moveTimer);
  moveTimer = setInterval(()=>{
    if(STATE.view!=='harita' || !leafletMap) return;
    MOCK_MASTERS.forEach(m=>{
      m.lat += (Math.random()-0.5)*0.003;
      m.lon += (Math.random()-0.5)*0.003;
      if(masterMarkers[m.id]) masterMarkers[m.id].setLatLng([m.lat,m.lon]);
    });
  }, 3500);
}

function addCustomerMarker(loc){
  if(!leafletMap) return;
  if(customerMarker){ leafletMap.removeLayer(customerMarker); }
  const icon = L.divIcon({className:'', html:`<div style="width:18px;height:18px;border-radius:50%;background:#2E7DFF;border:3px solid #fff;box-shadow:0 0 0 5px rgba(46,125,255,0.25);"></div>`, iconSize:[18,18]});
  customerMarker = L.marker([loc.lat,loc.lon],{icon}).addTo(leafletMap)
    .bindPopup('📍 Canlı Konumunuz')
    .on('click', ()=>{ STATE.addressPanelOpen=true; render(); });
}

function requestLiveLocation(cb){
  if(!navigator.geolocation){ showToast('Bu tarayıcı canlı konumu desteklemiyor.'); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const loc = {lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy};
    STATE.liveLocation = loc;
    STATE.liveAddress = null;
    try{
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), 4000);
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${loc.lat}&lon=${loc.lon}&zoom=18&addressdetails=1`, {signal: ctrl.signal});
      clearTimeout(t);
      const data = await res.json();
      const a = data.address || {};
      STATE.liveAddress = {
        mahalle: a.suburb || a.neighbourhood || a.quarter || '',
        sokak: a.road || '',
        ilce: a.town || a.county || a.city_district || a.state_district || '',
      };
    }catch(e){ STATE.liveAddress = null; }
    if(cb) cb(loc); else { STATE.addressPanelOpen=true; render(); }
  }, err=>{
    showToast('Konum alınamadı: izin gerekiyor. (' + err.message + ')');
  }, {enableHighAccuracy:true, timeout:8000});
}

  <div class="disclaimer">⚠️ Bu sözleşme metni örnek/taslak niteliğindedir; gerçek kullanım öncesi bir hukuk danışmanına onaylatmanız önerilir.</div>
  <div class="agree-row"><input type="checkbox" id="n-onay" data-action="toggle-agree" data-target="n-submit" /><span>Yazılım Kullanım Sözleşmesi'ni ve KVKK Aydınlatma Metni'ni okudum, aylık 3.000 TL ücreti kabul ediyorum.</span></div>
  <button class="cta" id="n-submit" disabled data-action="submit-reg" data-role="nakliye">Nakliyeci Olarak Kayıt Ol</button>`;
}

/* ============ TALEP FLOW ============ */
function talepFlowHtml(){
  if(!STATE.talepOpen) return '';
  const t = STATE.talep;
  const steps = ['Hizmet','Detaylar','Onay'];
  return `
  <div class="overlay">
    <div class="sheet" style="max-height:92vh;">
      <div class="sheet-head">
        <button class="iconbtn" data-action="talep-close">←</button>
        <div style="font-weight:800;">Talep Oluştur</div>
        <div style="width:36px;"></div>
      </div>
      <div class="progress">
        ${steps.map((lb,i)=>`<div style="flex:1;"><div class="bar ${i<=t.step?'on':''}"></div><div class="lb ${i===t.step?'on':''}">${lb}</div></div>`).join('')}
      </div>
      <div class="section" style="padding-top:0;">
        ${t.step===0?talepStep0():t.step===1?talepStep1():talepStep2()}
      </div>
      <div class="submitbar">
        <button class="cta" id="talep-next-btn" data-action="talep-next">${t.step<2?'Devam et →':'Talebi Gönder →'}</button>
      </div>
    </div>
  </div>`;
}

function talepStep0(){
  const t = STATE.talep;
  return `
  <div class="section-label">Hangi konuda destek lazım?</div>
  <div class="cat-grid">
    ${CATS.map(c=>`<button class="cat-tile ${t.cat===c.key?'active':''}" data-action="talep-cat" data-cat="${c.key}"><span class="ic">${c.ic}</span><span class="lb">${c.label}</span></button>`).join('')}
  </div>
  <div class="section-label" style="margin-top:14px;">Konum</div>
  <button class="cta ghost" data-action="talep-use-live">📍 ${t.useLive && STATE.liveLocation ? 'Canlı konum kullanılıyor ✓' : 'Canlı Konumumu Kullan'}</button>
  <div class="muted small" style="margin:10px 0;">veya manuel adres girin:</div>
  <label class="fl">İlçe</label>
  <select id="t-ilce" data-action="talep-chg-ilce">${ilceOptions(t.ilce)}</select>
  <label class="fl">Mahalle</label>
  <select id="t-mahalle">${mahalleOptionsFor(t.ilce||'muratpasa', t.mahalle)}</select>
  <label class="fl">Sokak / Cadde</label>
  <input id="t-sokak" value="${t.sokak}" placeholder="Örn. Atatürk Caddesi" />
  <label class="fl">Daire No</label>
  <input id="t-daire" value="${t.daire}" placeholder="Örn. 12" />`;
}

function talepStep1(){
  const t = STATE.talep;
  return `
  <div class="section-label">Sorununuzu anlatın</div>
  <label class="fl">Talep Başlığı</label>
  <input id="t-title" value="${t.title}" placeholder="Örn. Salon prizlerinde elektrik yok" />
  <label class="fl">Açıklama</label>
  <textarea id="t-desc" rows="4" placeholder="Sorunu kısaca anlatın…">${t.desc}</textarea>
  <div class="section-label" style="margin-top:14px;">Öncelik</div>
  <div class="priority-row">
    <button class="priority-btn ${t.priority==='acil'?'on':''}" data-action="talep-prio" data-p="acil"><b>Acil</b><br><span class="small">30 dk içinde</span></button>
    <button class="priority-btn ${t.priority==='bugun'?'on':''}" data-action="talep-prio" data-p="bugun"><b>Bugün</b><br><span class="small">Gün içinde</span></button>
    <button class="priority-btn ${t.priority==='planli'?'on':''}" data-action="talep-prio" data-p="planli"><b>Planlı</b><br><span class="small">Tarih seç</span></button>
  </div>
  <div class="section-label">Tercih Edilen Zaman</div>
  ${TIME_SLOTS.map(sl=>`<button class="slot-btn ${t.slot===sl?'on':''}" data-action="talep-slot" data-slot="${sl}">🕒 ${sl}</button>`).join('')}
  <div class="section-label" style="margin-top:10px;">Fotoğraf / Video <span class="muted">(isteğe bağlı)</span></div>
  <button class="cta ghost" data-action="talep-photo">📷 ${t.photo?'1 dosya eklendi ✓':'Fotoğraf / video ekle'}</button>`;
}

function talepStep2(){
  const t = STATE.talep;
  const d = distr(t.ilce);
  const locStr = t.useLive && STATE.liveLocation ? 'Canlı Konum (GPS)' : `${d?d.name:'—'}, ${t.mahalle||'—'} · ${t.sokak||''} ${t.daire?('· Daire '+t.daire):''}`;
  return `
  <div class="section-label">Talebini gözden geçir</div>
  <div class="card">
    <div class="between" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);"><span class="muted small">Hizmet</span><b class="small">${catInfo(t.cat).ic} ${catInfo(t.cat).label}</b></div>
    <div class="between" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);"><span class="muted small">Konum</span><b class="small" style="text-align:right;">${locStr}</b></div>
    <div class="between" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);"><span class="muted small">Başlık</span><b class="small">${t.title||'—'}</b></div>
    <div class="between" style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.07);"><span class="muted small">Öncelik</span><b class="small">${t.priority==='acil'?'Acil':t.priority==='bugun'?'Bugün':'Planlı'}</b></div>
    <div class="between" style="padding:8px 0;"><span class="muted small">Zaman</span><b class="small">${t.slot}</b></div>
  </div>
  <div class="disclaimer" style="border-color:rgba(63,199,166,0.4);background:rgba(63,199,166,0.08);color:var(--teal);">Talebi gönderdiğinizde bölgenizdeki uygun ustalara anında bildirim gider.</div>`;
}

/* ============ SUPPORT ============ */
function supportHtml(){
  return `
  <button class="support-fab" data-action="toggle-support">${STATE.supportOpen?'✕':'💬'}</button>
  ${STATE.supportOpen ? `
  <div class="support-panel">
    <div class="support-head"><span>🟢 Canlı Destek</span><button class="iconbtn" style="width:26px;height:26px;background:rgba(0,0,0,0.15);border:none;" data-action="toggle-support">✕</button></div>
    <div class="support-msgs" id="supportMsgs">
      ${STATE.supportMsgs.map(m=>`<div class="msg ${m.from==='me'?'me':'bot'}">${m.text}</div>`).join('')}
    </div>
    <div class="support-input">
      <input id="support-in" placeholder="Mesajınızı yazın…" />
      <button data-action="support-send">Gönder</button>
    </div>
  </div>` : ''}`;
}

/* ============ ROUTER / RENDER ============ */
function render(){
  const view = STATE.view;
  let html = view==='home'?viewHome() : view==='harita'?viewHarita() : view==='isler'?viewIsler() : viewKayit();
  html += `
  <div class="bottomnav">
    <button class="navbtn ${view==='home'?'active':''}" data-action="nav" data-view="home"><span class="ic">🏠</span>Keşfet</button>
    <button class="navbtn ${view==='harita'?'active':''}" data-action="nav" data-view="harita"><span class="ic">🗺️</span>Harita</button>
    <button class="fab" data-action="open-talep" data-cat="">＋</button>
    <button class="navbtn ${view==='isler'?'active':''}" data-action="nav" data-view="isler"><span class="ic">📋</span>İşlerim</button>
    <button class="navbtn ${view==='kayit'?'active':''}" data-action="nav" data-view="kayit"><span class="ic">📝</span>Kayıt</button>
  </div>`;
  html += talepFlowHtml();
  html += addressPanelHtml();
  html += supportHtml();
  html += toastHtml();
  document.getElementById('app').innerHTML = html;
  if(view==='harita') setTimeout(initLeaflet, 30);
  if(STATE.registerTab==='usta' && view==='kayit') wireUstaIlceMahalle();
}

function wireUstaIlceMahalle(){
  const boxes = document.querySelectorAll('input[name="u-ilce"]');
  boxes.forEach(b=> b.addEventListener('change', updateUstaMahalleGrid));
}
function updateUstaMahalleGrid(){
  const checked = Array.from(document.querySelectorAll('input[name="u-ilce"]:checked')).map(b=>b.value);
  const grid = document.getElementById('u-mahalle-grid');
  if(!grid) return;
  if(checked.length===0){ grid.innerHTML = `<div class="muted small" style="padding:8px;">İlçe seçtiğinizde mahalleler burada listelenecek.</div>`; return; }
  let html='';
  checked.forEach(id=>{
    const d = distr(id);
    d.neighborhoods.forEach(n=>{ html += `<label class="chip"><input type="checkbox" name="u-mahalle" value="${d.name} / ${n}" /> ${n}</label>`; });
  });
  grid.innerHTML = html;
}

/* ============ EVENT DELEGATION ============ */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  if(a==='nav'){ STATE.view = el.dataset.view; if(el.dataset.tab) STATE.registerTab = el.dataset.tab; render(); }
  else if(a==='toggle-role'){ STATE.role = STATE.role==='musteri'?'usta':'musteri'; render(); }

  else if(a==='open-talep'){ STATE.talepOpen=true; STATE.talep = {step:0, cat: el.dataset.cat||null, useLive:false, ilce:'muratpasa', mahalle:distr('muratpasa').neighborhoods[0], sokak:'', daire:'', title:'', desc:'', priority:'acil', slot:TIME_SLOTS[0], photo:false}; render(); }
  else if(a==='talep-close'){ STATE.talepOpen=false; render(); }
  else if(a==='talep-cat'){ STATE.talep.cat = el.dataset.cat; render(); }
  else if(a==='talep-use-live'){ STATE.talep.useLive = true; requestLiveLocation(()=>{ render(); }); }
  else if(a==='talep-prio'){ STATE.talep.priority = el.dataset.p; render(); }
  else if(a==='talep-slot'){ STATE.talep.slot = el.dataset.slot; render(); }
  else if(a==='talep-photo'){ STATE.talep.photo = true; render(); }
  else if(a==='talep-next'){ handleTalepNext(); }

  else if(a==='get-live'){ requestLiveLocation(()=>{ render(); }); }
  else if(a==='close-address' || a==='close-address-bg'){ if(e.target===el || a==='close-address'){ STATE.addressPanelOpen=false; render(); } }
  else if(a==='address-to-talep'){
    const ilceVal = document.getElementById('ap-ilce').value;
    const mahalleVal = document.getElementById('ap-mahalle').value;
    const sokakVal = document.getElementById('ap-sokak').value;
    const daireVal = document.getElementById('ap-daire').value;
    STATE.addressPanelOpen = false;
    STATE.talepOpen = true;
    STATE.talep = {step:1, cat:null, useLive:true, ilce:'', mahalle:mahalleVal, sokak:sokakVal, daire:daireVal, title:'', desc:'', priority:'acil', slot:TIME_SLOTS[0], photo:false};
    render();
  }

  else if(a==='accept-job'){ const id=+el.dataset.id; const j=STATE.jobs.find(j=>j.id===id); if(j){ j.status='kabul'; j.usta='Siz (Demo Usta)'; j.eta = (5+Math.floor(Math.random()*20))+' dk'; showToast('İşi kabul ettiniz: '+j.title); } render(); }
  else if(a==='complete-job'){ const id=+el.dataset.id; const j=STATE.jobs.find(j=>j.id===id); if(j){ j.status='tamamlandi'; showToast('İş tamamlandı olarak işaretlendi.'); } render(); }

  else if(a==='reg-tab'){ STATE.registerTab = el.dataset.tab; render(); }
  else if(a==='toggle-agree'){ const btn=document.getElementById(el.dataset.target); if(btn) btn.disabled = !el.checked; }
  else if(a==='submit-reg'){ handleSubmitReg(el.dataset.role); }

  else if(a==='toggle-support'){ STATE.supportOpen = !STATE.supportOpen; render(); }
  else if(a==='support-send'){ sendSupportMsg(); }
});

document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.id==='support-in'){ sendSupportMsg(); }
});

document.addEventListener('change', function(e){
  if(e.target.id==='m-ilce' || e.target.id==='s-ilce'){
    const target = e.target.dataset.target;
    const sel = document.getElementById(target);
    if(sel) sel.innerHTML = mahalleOptionsFor(e.target.value,'');
  }
  if(e.target.id==='t-ilce'){
    const sel = document.getElementById('t-mahalle');
    if(sel) sel.innerHTML = mahalleOptionsFor(e.target.value,'');
    STATE.talep.ilce = e.target.value;
  }
});

function handleTalepNext(){
  const t = STATE.talep;
  if(t.step===0){
    if(!t.cat){ showToast('Lütfen bir hizmet kategorisi seçin.'); return; }
    if(!t.useLive){
      t.ilce = document.getElementById('t-ilce') ? document.getElementById('t-ilce').value : t.ilce;
      t.mahalle = document.getElementById('t-mahalle') ? document.getElementById('t-mahalle').value : t.mahalle;
      t.sokak = document.getElementById('t-sokak') ? document.getElementById('t-sokak').value : t.sokak;
      t.daire = document.getElementById('t-daire') ? document.getElementById('t-daire').value : t.daire;
    }
    t.step=1; render(); return;
  }
  if(t.step===1){
    t.title = document.getElementById('t-title') ? document.getElementById('t-title').value : t.title;
    t.desc = document.getElementById('t-desc') ? document.getElementById('t-desc').value : t.desc;
    if(!t.title || t.title.trim().length<3){ showToast('Lütfen kısa bir talep başlığı girin.'); return; }
    t.step=2; render(); return;
  }
  if(t.step===2){ submitTalep(); }
}

function submitTalep(){
  const t = STATE.talep;
  const id = jobIdc++;
  const d = distr(t.ilce);
  const addr = t.useLive && STATE.liveLocation ? 'Canlı Konum (GPS ile alındı)' : `${t.mahalle||''} Mah. · ${d?d.name:''}${t.sokak?(' · '+t.sokak):''}${t.daire?(' · Daire '+t.daire):''}`;
  STATE.jobs.unshift({id, title:t.title, cat:t.cat, ilce:d?d.name:'', mahalle:t.mahalle, addr, status:'bekliyor'});
  // yakındaki uygun ustaları bul
  let refLat=36.8969, refLon=30.7133;
  if(t.useLive && STATE.liveLocation){ refLat=STATE.liveLocation.lat; refLon=STATE.liveLocation.lon; }
  else if(d){ refLat=d.lat; refLon=d.lon; }
  const nearby = MOCK_MASTERS.filter(m=>m.cat===t.cat || t.cat==='diger')
    .map(m=>({...m, dist:haversine(refLat,refLon,m.lat,m.lon)}))
    .sort((a,b)=>a.dist-b.dist).slice(0,5);
  const count = nearby.length || Math.floor(Math.random()*4)+2;
  STATE.talepOpen = false;
  STATE.view = 'isler';
  render();
  showToast(`✅ Talebiniz alındı! Bölgenizdeki ${count} ustaya bildirim gönderildi.`);
}

function handleSubmitReg(role){
  const map = {musteri:'m', usta:'u', site:'s', nakliye:'n'};
  const p = map[role];
  const ad = document.getElementById(p+'-ad');
  if(!ad || !ad.value.trim()){ showToast('Lütfen ad/işletme adı alanını doldurun.'); return; }
  showToast('🎉 Kaydınız alındı! ' + (role==='musteri' ? 'Hoş geldiniz.' : 'Ekibimiz sizinle iletişime geçecek.'));
  STATE.view = 'home';
  render();
}

function sendSupportMsg(){
  const inp = document.getElementById('support-in');
  if(!inp || !inp.value.trim()) return;
  STATE.supportMsgs.push({from:'me', text:inp.value});
  const txt = inp.value;
  render();
  setTimeout(()=>{
    STATE.supportMsgs.push({from:'bot', text:'Teşekkürler! Talebinizi aldık: "'+txt+'" — bir temsilcimiz kısa süre içinde size dönüş yapacaktır.'});
    render();
  }, 900);
}

render();
</script>
</body>
</html>
